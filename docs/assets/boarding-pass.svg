<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Bing Bong — Your prompt has landed</title><desc id="d">An illustrated boarding pass with a smiling paper plane, from prompt to done.</desc><rect width="1200" height="330" rx="18" fill="#102a43"/><path d="M910 0V330" stroke="#698299" stroke-width="2" stroke-dasharray="7 10"/><circle cx="910" cy="0" r="15" fill="#fff"/><circle cx="910" cy="330" r="15" fill="#fff"/><text x="48" y="62" font-family="Verdana,sans-serif" font-size="23" fill="#9fbad0">bing-bong</text><text x="45" y="139" font-family="Verdana,sans-serif" font-size="50" font-weight="bold" fill="#fff">Your prompt</text><text x="45" y="201" font-family="Verdana,sans-serif" font-size="50" font-weight="bold" fill="#fff">has landed.</text><path d="m620 108 227-48-87 187-45-91Z" fill="#eff7fc"/><path d="m715 156 132-96-87 187-11-78" fill="#b8d7ec"/><path d="m715 156 34 13 98-109" stroke="#102a43" stroke-width="3" fill="none"/><circle cx="754" cy="125" r="4" fill="#102a43"/><circle cx="776" cy="113" r="4" fill="#102a43"/><path d="M758 138q13 6 21-10" fill="none" stroke="#102a43" stroke-width="3" stroke-linecap="round"/><path d="M565 222q-80 40 34 52t-77 20" stroke="#f5a95d" stroke-width="3" stroke-dasharray="8 6" fill="none"/><text x="48" y="280" font-family="Verdana,sans-serif" font-size="18" fill="#9fbad0">A little chime for a finished turn.</text><g font-family="monospace" fill="#9fbad0" font-size="17"><text x="956" y="65">FROM</text><text x="956" y="165">TO</text></g><g font-family="Verdana,sans-serif" fill="#fff" font-size="26" font-weight="bold"><text x="956" y="103">Prompt</text><text x="956" y="203">Done</text></g><text x="956" y="280" font-family="monospace" font-size="20" fill="#f5a95d">660 → 520 Hz</text></svg>